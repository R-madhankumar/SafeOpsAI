# prometheus.local.yml — Use this when running WITHOUT Docker Compose.
# All services are expected on localhost at their default ports.
# Start with: prometheus --config.file=prometheus.local.yml
#
# Docker Compose uses prometheus.yml (Docker internal hostnames).
# Local Windows dev uses THIS file.

global:
  scrape_interval:     10s
  evaluation_interval: 10s
  scrape_timeout:      5s

rule_files:
  - "alert_rules.yml"

scrape_configs:

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # SafeOpsAI Backend (FastAPI /metrics)
  - job_name: safeops-backend
    static_configs:
      - targets: ["localhost:8000"]
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout:  4s

  # Incident Agent
  - job_name: incident-agent
    static_configs:
      - targets: ["localhost:8001"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Root Cause Agent
  - job_name: root-cause-agent
    static_configs:
      - targets: ["localhost:8002"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Scoring Agent
  - job_name: scoring-agent
    static_configs:
      - targets: ["localhost:8003"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Coordinator Agent
  - job_name: coordinator-agent
    static_configs:
      - targets: ["localhost:8004"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Sandbox Validation Agent
  - job_name: sandbox-agent
    static_configs:
      - targets: ["localhost:8005"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Autonomous Remediation Agent
  - job_name: remediation-agent
    static_configs:
      - targets: ["localhost:8006"]
    metrics_path: /metrics
    scrape_interval: 10s

  # PostgreSQL exporter (optional — install and run postgres_exporter locally)
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["localhost:9187"]
